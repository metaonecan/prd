<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC致富模拟器：20XX末日版</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #00ff41;
            --danger-color: #ff3e3e;
            --accent-color: #00ffe1;
            --neon-glow: rgba(0, 255, 65, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            width: 95%;
            max-width: 650px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #222;
            padding: 20px;
            box-shadow: 0 0 20px var(--neon-glow);
            position: relative;
        }

        canvas {
            width: 100%;
            height: 120px;
            background: #000;
            border: 1px solid #222;
            margin-bottom: 15px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85em;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .stat-value { color: var(--accent-color); font-weight: bold; }

        #story-display {
            height: 180px;
            overflow-y: auto;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.05em;
        }

        .choices-container { display: flex; flex-direction: column; gap: 10px; }

        button {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            font-family: inherit;
        }

        button:hover {
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 10px var(--text-color);
        }

        /* 动画反馈 */
        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 结算证书 */
        #cert-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .cert-box {
            border: 4px double var(--text-color);
            padding: 30px;
            background: #111;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="marketChart"></canvas>
    
    <div class="stats-bar">
        <div>持有: <span id="btc-val" class="stat-value">0.1000</span> BTC</div>
        <div>信仰: <span id="faith-val" class="stat-value">60</span>%</div>
        <div>压力: <span id="stress-val" class="stat-value">50</span>%</div>
        <div>身价: <span id="wealth-val" class="stat-value">空间站</span></div>
    </div>

    <div id="story-display">正在同步 20XX 年区块链终端...</div>

    <div class="choices-container" id="choices"></div>

    <div id="cert-overlay">
        <div class="cert-box">
            <h2 id="cert-title"></h2>
            <p>最终持有: <span id="cert-btc" class="stat-value"></span> BTC</p>
            <p>获得称号: <span id="cert-rank" class="stat-value"></span></p>
            <button onclick="location.reload()" style="margin-top:20px; width:100%; text-align:center;">重启时间线</button>
        </div>
    </div>
</div>

<script>
    let state = {
        btc: 0.1, faith: 60, stress: 50, wealth: "1座空间站",
        currentLevel: 0, prices: Array(40).fill(60000)
    };

    const levels = [
        {
            title: "第一关：马斯克的推特抽风",
            desc: "马斯克发推：'BTC... 📉?' 市场暴跌 40%！",
            options: [
                { text: "【梭哈】变卖氧气罐抄底", change: { btc: 0.05, faith: 20, stress: 30 }, msg: "呼吸困难，但币变多了！", crash: true },
                { text: "【物理断网】只要我不看就不亏", change: { btc: 0, faith: 5, stress: -10 }, msg: "逃避虽可耻但有用。" }
            ]
        },
        {
            title: "第二关：中本聪私钥显灵",
            desc: "创世地址突然活跃，广播寻求算力。全宇宙疯了！",
            options: [
                { text: "【人肉算力】用文曲星手算", change: { btc: 0, faith: 30, stress: 20 }, msg: "你快悟了，虽然算力不足。" },
                { text: "【卖掉键盘】赚取现金流", change: { btc: -0.01, faith: -20, stress: -20 }, msg: "拿到了钱，看BTC飞向月球。" }
            ]
        },
        {
            title: "第三关：美联储宇宙大放水",
            desc: "印钞速度超光速。流浪汉都用百亿钞票叠纸飞机。",
            options: [
                { text: "【自创代币】发行 $TRASH 币", change: { btc: 0.08, faith: 30, stress: 40 }, wealth: "星际邮轮", msg: "你成功割到了外星韭菜！" },
                { text: "【硬通货】换成实物泡面", change: { btc: -0.02, faith: 10, stress: -20 }, wealth: "一仓库泡面", msg: "调料包才是真金。" }
            ]
        },
        {
            title: "第四关：交易所“拔网线”",
            desc: "暴涨 200%！交易所突然维护 500 年。",
            options: [
                { text: "【冬眠大法】睡到 500 年后", change: { btc: 1.0, faith: 100, stress: 0 }, wealth: "银河系公民", msg: "醒来时你已富可敌国。" },
                { text: "【物理开锁】强拆监控节点", change: { btc: 0.1, faith: 20, stress: 30 }, msg: "成功止盈，逃出生天！" }
            ]
        },
        {
            title: "第五关：量子计算机破解传闻",
            desc: "木卫二信号称破解了加密算法！币价归零！",
            options: [
                { text: "【加仓】这是外星FUD", change: { btc: 0.2, faith: 40, stress: 50 }, msg: "你是真正的战士！" },
                { text: "【清仓】回归原始生活", change: { btc: -0.1, faith: -50, stress: -30 }, msg: "你保住了命，但心碎了。" }
            ]
        },
        {
            title: "终极关：虫洞大逃杀",
            desc: "虫洞吞噬地球，逃生门票只收 BTC，且只有 10 张！",
            options: [
                { text: "【ALL IN】交出全部资产登船", change: { btc: 0.5, faith: 100, stress: 50 }, wealth: "新地球领主", msg: "再见，旧人类！" },
                { text: "【共存亡】在地球 HODL 到死", change: { btc: 0, faith: -100, stress: 100 }, msg: "你在虚无中见到了中本聪。" }
            ]
        }
    ];

    const canvas = document.getElementById('marketChart');
    const ctx = canvas.getContext('2d');

    function drawChart() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let step = canvas.width / (state.prices.length - 1);
        for(let i=0; i<state.prices.length; i++){
            let x = i * step;
            let y = canvas.height - (state.prices[i] / 150000 * canvas.height);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
    }

    function updateStats() {
        document.getElementById('btc-val').innerText = state.btc.toFixed(4);
        document.getElementById('faith-val').innerText = state.faith;
        document.getElementById('stress-val').innerText = state.stress;
        document.getElementById('wealth-val').innerText = state.wealth;
        if(state.faith <= 0 || state.stress >= 100 || state.btc <= 0) endGame(false);
    }

    function handleChoice(opt) {
        state.btc = Math.max(0, state.btc + opt.change.btc);
        state.faith = Math.max(0, Math.min(100, state.faith + opt.change.faith));
        state.stress = Math.max(0, Math.min(100, state.stress + opt.change.stress));
        if(opt.wealth) state.wealth = opt.wealth;

        // K线变动
        let lastPrice = state.prices[state.prices.length-1];
        let newPrice = opt.crash ? lastPrice * 0.4 : lastPrice * (1 + (Math.random()*0.4));
        state.prices.push(newPrice);
        state.prices.shift();
        drawChart();

        if(opt.crash) {
            document.getElementById('game-container').classList.add('shake');
            setTimeout(()=>document.getElementById('game-container').classList.remove('shake'), 400);
        }

        const display = document.getElementById('story-display');
        display.innerHTML = `<strong>${opt.msg}</strong><br><br>系统状态更新中...`;
        
        document.getElementById('choices').innerHTML = `<button onclick="nextLevel()">继续深入...</button>`;
        updateStats();
    }

    function renderLevel() {
        if(state.currentLevel >= levels.length) return endGame(true);
        const l = levels[state.currentLevel];
        document.getElementById('story-display').innerHTML = `<b>${l.title}</b><br><br>${l.desc}`;
        const container = document.getElementById('choices');
        container.innerHTML = '';
        l.options.forEach(o => {
            const btn = document.createElement('button');
            btn.innerText = o.text;
            btn.onclick = () => handleChoice(o);
            container.appendChild(btn);
        });
    }

    function nextLevel() {
        state.currentLevel++;
        renderLevel();
    }

    function endGame(win) {
        const overlay = document.getElementById('cert-overlay');
        overlay.style.display = 'flex';
        document.getElementById('cert-title').innerText = win ? "🚀 幸存巨鲸证书" : "💀 归零讣告";
        document.getElementById('cert-btc').innerText = state.btc.toFixed(4);
        document.getElementById('cert-rank').innerText = win ? (state.btc > 1 ? "创世神" : "钻石手") : "赛博炮灰";
    }

    drawChart();
    renderLevel();
</script>
</body>
</html>
